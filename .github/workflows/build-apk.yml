name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git python3-pip python3-venv zlib1g zlib1g-dev openjdk-17-jdk libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade cython -i https://pypi.tuna.tsinghua.edu.cn/simple
          python -m pip install buildozer==1.5.0 -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk
